services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: modularbuild
      POSTGRES_PASSWORD: modularbuild
      POSTGRES_DB: modularbuild
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modularbuild"]
      interval: 2s
      timeout: 2s
      retries: 15
